# Справочная копия правил HDT. Это не отдельный автоматически подключаемый файл.
# Autostart, bind и правила Battle.net/overlay/Hearthstone находятся в
# ~/.config/hypr/userprefs.conf. Последний HDT-main блок находится в
# ~/.config/hypr/windowrules.conf.

# Разделяет одинаковый Wine WM_CLASS игры и HDT для иконок Waybar и скрывает
# пустое служебное окно Wine. Внутренний lock не допускает второй экземпляр.
exec-once = sh -c '"$HOME/.config/waybar/scripts/wine-taskbar-icons.py"'

# Fullscreen кладёт Hearthstone поверх прозрачного overlay. Для защищённых
# окон Super+F только восстанавливает layout; у остальных программ остаётся
# обычным переключателем fullscreen.
unbind = $mainMod, F
bindd = $mainMod, F, Safe fullscreen (protect HDT overlay), exec, sh -c '"$HOME/.config/waybar/scripts/wine-taskbar-icons.py" --toggle-fullscreen'

# Guard переносит Battle.net на workspace наиболее недавно активного окна
# Lutris. Если Lutris не запущен или его workspace определить нельзя, это
# статическое правило немедленно использует workspace 3.
windowrule {
    name = battlenet_workspace_fallback
    match:class = ^(steam_app_default|[Bb]attle\.net.*)$
    match:title = ^Battle\.net.*$
    workspace = 3 silent
}

# Wine/WPF превращает полностью прозрачный фон HearthstoneOverlay в чёрный.
# hdt-prelaunch.py оставляет альфу 1/255, а no_blur не даёт Hyprland
# визуально проявить этот почти прозрачный фон.
windowrule {
    name = hearthstone_deck_tracker_overlay
    match:class = ^steam_app_default$
    match:title = ^HearthstoneOverlay$
    float = true
    workspace = 5 silent
    move = 10 49
    size = 2729 1090
    fullscreen_state = 0 0
    suppress_event = fullscreen maximize fullscreenoutput
    min_size = 2729 1090
    max_size = 2729 1090
    opacity = 1.0 override 1.0 override 1.0 override
    no_blur = true
    no_shadow = true
    no_dim = true
    no_anim = true
    decorate = false
    border_size = 0
    rounding = 0
    opaque = false
}

windowrule {
    name = hearthstone_no_inactive_tint
    match:title = ^Hearthstone$
    match:class = ^(steam_app_default|hearthstone|hearthstone-hand-drawn)$
    workspace = 5 silent
    fullscreen_state = 0 0
    suppress_event = fullscreen maximize fullscreenoutput
    opacity = 1.0 override 1.0 override 1.0 override
}

# Главное окно настроек HDT — не полноэкранный overlay.
windowrule {
    name = hearthstone_deck_tracker_main
    match:title = ^Hearthstone Deck Tracker$

    workspace = 3 silent
    float = true
    move = (monitor_w*0.05) (monitor_h*0.05)
    size = 960 540
    fullscreen_state = 0 0
    suppress_event = fullscreen maximize fullscreenoutput
    min_size = 960 540
    max_size = 960 540
    allows_input = true

    no_shadow = true
    no_blur = true
    no_dim = true
    decorate = false

    opacity = 1.0 override 1.0 override 1.0 override
}
